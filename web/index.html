<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：内容延伸到 iPhone 刘海/圆角区域，配合 CSS env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CC_DashBoard" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.ico" />
    <title>CC_DashBoard</title>
    <style>
      /* 移动端细节优化（Tailwind 不便表达的几条） */
      @media (max-width: 767px) {
        /* 防止长 URL / 主机名撑破布局导致整页横向滚动 */
        body {
          overflow-x: hidden;
        }
        /* 宽表格改为容器内横向滚动，而不是把列挤成一条竖线。
           卡片式列表（table 在 div 里）不受影响。 */
        section:has(> table) {
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
        }
        section:has(> table) > table {
          min-width: 520px;
        }
        /* 去掉移动端点击高亮块，改用 active: 样式 */
        button,
        a {
          -webkit-tap-highlight-color: transparent;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
